; meshcore-adv-ui build environments.
;
;   pixi run sim     host simulator (headless, scripted)  -> .pio/build/sim/program
;   pixi run test    host unit tests
;   pixi run build   Cardputer ADV firmware (BLE default, USB-only small build)

[platformio]
src_dir = src
default_envs = sim
extra_configs = platformio.local.ini

[common]
build_flags =
  -std=gnu++17
  -I src
  -D MC_UI_VERSION=\"0.1.0-dev\"
ui_src =
  +<ui/>
  +<gen/>

[env:sim]
platform = native
extra_scripts = pre:scripts/pio_pre.py
build_flags = ${common.build_flags}
  -I boards/sim
  -I boards/cardputer_adv/keymap
  -O1 -g -Wall -Wno-unused-function
  -fsanitize=address,undefined
build_unflags = -std=gnu++11 -std=gnu++14
build_src_filter = ${common.ui_src}
  +<../boards/sim/>
  +<../boards/cardputer_adv/keymap/*.c>
test_build_src = yes

; Unit tests: same sources as the simulator, separate build dir so running
; tests never replaces the simulator binary.
[env:test]
extends = env:sim

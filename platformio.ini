; meshcore-adv-ui build environments.
;
;   pixi run sim     host simulator (headless, scripted)  -> .pio/build/sim/program
;   pixi run test    host unit tests
;   pixi run build   Cardputer ADV firmware (BLE default, USB-only small build)

[platformio]
src_dir = src
default_envs = sim
extra_configs = platformio.local.ini

[common]
build_flags =
  -std=gnu++17
  -I src
  -D MC_UI_VERSION=\"0.1.0-dev\"
ui_src =
  +<ui/>
  +<gen/>

[env:sim]
platform = native
extra_scripts = pre:scripts/pio_pre.py
build_flags = ${common.build_flags}
  -I boards/sim
  -I boards/cardputer_adv/keymap
  -O1 -g -Wall -Wno-unused-function
  -fsanitize=address,undefined
build_unflags = -std=gnu++11 -std=gnu++14
build_src_filter = ${common.ui_src}
  +<../boards/sim/>
  +<../boards/cardputer_adv/keymap/*.c>
test_build_src = yes

; Unit tests: same sources as the simulator, separate build dir so running
; tests never replaces the simulator binary.
[env:test]
extends = env:sim
test_ignore = test_backup   ; needs the MeshCore host shim: runs under env:simnet

; Real MeshCore (patched submodule) on the host: several companion nodes on a
; simulated LoRa medium with a virtual clock, driving the real UI.
[meshcore_host]
build_flags =
  -D RP2040_PLATFORM   ; MeshCore's plain-fs::FS storage path (host shim)
  -D MESHCORE_HOST_SIM
  -include stdint.h     ; some Arduino libraries expect it to come with Arduino.h
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=32
  -D LORA_FREQ=910.525 -D LORA_BW=62.5 -D LORA_SF=7 -D LORA_CR=5
  -I boards/simnet
  -I boards/simnet/arduino
  -I .deps/meshcore/src
  -I .deps/meshcore/lib/ed25519
  -I .deps/meshcore/examples/companion_radio
meshcore_src =
  +<../.deps/meshcore/src/*.cpp>
  +<../.deps/meshcore/lib/ed25519/*.c>
  +<../.deps/meshcore/src/helpers/BaseChatMesh.cpp>
  +<../.deps/meshcore/src/helpers/AdvertDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/TxtDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/IdentityStore.cpp>
  +<../.deps/meshcore/src/helpers/ConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/TransportKeyStore.cpp>
  +<../.deps/meshcore/src/helpers/RegionMap.cpp>
  +<../.deps/meshcore/src/helpers/StaticPoolPacketManager.cpp>
  +<../.deps/meshcore/examples/companion_radio/MyMesh.cpp>
  +<../.deps/meshcore/examples/companion_radio/DataStore.cpp>

[env:simnet]
platform = native
extra_scripts = pre:scripts/pio_pre.py
lib_deps =
  rweather/Crypto @ ^0.4.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
lib_compat_mode = off
build_flags = ${common.build_flags}
  ${meshcore_host.build_flags}
  -I boards/sim
  -I boards/cardputer_adv/keymap
  -O1 -g -Wall -Wno-unused-function -Wno-unused-variable -Wno-sign-compare
  -fsanitize=address,undefined
  -fno-sanitize=shift   ; ed25519 ref10 shifts negative values by design
build_unflags = -std=gnu++11 -std=gnu++14
build_src_filter = ${common.ui_src}
  ${meshcore_host.meshcore_src}
  +<app/>
  +<../boards/simnet/>
  +<../boards/sim/sim_keyboard.cpp>
  +<../boards/sim/runner.cpp>
  +<../boards/cardputer_adv/keymap/*.c>

; Unit tests that need the MeshCore host shim; separate build dir so tests
; never replace the simnet program.
[env:simnet_test]
extends = env:simnet
test_filter = test_backup
test_build_src = yes
